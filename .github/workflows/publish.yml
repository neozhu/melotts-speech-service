name: Verify and publish CPU image
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghcr-release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    # Set TTS_RELEASE_RUNNER to an 8-vCPU Linux x86-64 runner for target-hardware measurements.
    runs-on: ${{ vars.TTS_RELEASE_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - id: meta
        name: Validate release and generate image tags
        run: python scripts/release_metadata.py
      - name: Install verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo ffmpeg
          python -m pip install -r requirements-ci.txt
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build final CPU artifact with provenance and SBOM
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          outputs: type=oci,dest=${{ runner.temp }}/melotts.oci.tar
          tags: ${{ steps.meta.outputs.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Load the built artifact into Docker
        env:
          ARCHIVE: ${{ runner.temp }}/melotts.oci.tar
        run: skopeo copy "oci-archive:$ARCHIVE" docker-daemon:melotts-test:local
      - name: Validate deployment configuration
        env:
          TTS_IMAGE: melotts-test:local
          API_KEY: ci-configuration-validation-only
        run: docker compose -f deploy/compose.yaml config --quiet
      - name: Real CPU synthesis, decoding, overload, soak and cache restart
        run: bash scripts/smoke.sh melotts-test:local smoke-results
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse immutable tag overwrites
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          IMMUTABLE_TAGS: ${{ steps.meta.outputs.immutable_tags }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/check_registry_tags.py
      - name: Publish the exact verified OCI artifact and check its digest
        id: publish
        env:
          ARCHIVE: ${{ runner.temp }}/melotts.oci.tar
          TAGS: ${{ steps.meta.outputs.tags }}
          EXPECTED_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          first=true
          while IFS= read -r tag; do
            skopeo copy --all --preserve-digests --authfile "$HOME/.docker/config.json" \
              "oci-archive:$ARCHIVE" "docker://$tag"
            actual="sha256:$(skopeo inspect --raw --authfile "$HOME/.docker/config.json" "docker://$tag" | sha256sum | cut -d ' ' -f 1)"
            test "$actual" = "$EXPECTED_DIGEST"
            if "$first"; then
              echo "digest=$actual" >> "$GITHUB_OUTPUT"
              first=false
            fi
            printf '%s@%s\n' "${tag%:*}" "$actual" >> smoke-results/published-images.txt
          done <<< "$TAGS"
          {
            echo 'Verified CPU image published'
            echo '```'
            printf '%s\n' "$TAGS"
            echo "$EXPECTED_DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cpu-inference-results-${{ github.sha }}
          path: smoke-results/
          if-no-files-found: warn
          retention-days: 14
